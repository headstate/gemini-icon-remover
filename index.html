<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Icon Remover</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M9 3v18M15 3v18M3 9h18M3 15h18"/>
                </svg>
                <h1>Gemini Icon Remover</h1>
            </div>
            <p class="subtitle">Remove AI watermarks from your images</p>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Upload Section -->
            <section id="upload-section" class="upload-section">
                <div class="upload-area" id="upload-area">
                    <input type="file" id="file-input" accept="image/*" hidden>
                    <div class="upload-content">
                        <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        <h3>Drop your image here</h3>
                        <p>or <span class="browse-link">browse</span> to upload</p>
                        <p class="file-types">Supports: JPG, PNG, WEBP</p>
                    </div>
                </div>
            </section>

            <!-- Editor Section (Hidden initially) -->
            <section id="editor-section" class="editor-section hidden">
                <!-- Toolbar -->
                <div class="toolbar">
                    <div class="tool-group">
                        <button id="mode-auto" class="tool-btn active" title="Auto-detect mode">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <path d="m21 21-4.35-4.35"/>
                            </svg>
                            <span>Auto</span>
                        </button>
                        <button id="mode-manual" class="tool-btn" title="Manual Brush mode">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                                <path d="M2 2l7.586 7.586"/>
                                <circle cx="11" cy="11" r="2"/>
                            </svg>
                            <span>Brush</span>
                        </button>
                        <button id="mode-wand" class="tool-btn" title="Magic Wand mode">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2.5 2.5l19 19"/>
                                <path d="M15 4h4v4"/>
                                <path d="M5 15v4h4"/>
                                <circle cx="18" cy="6" r="1"/>
                                <circle cx="6" cy="18" r="1"/>
                            </svg>
                            <span>Wand</span>
                        </button>
                    </div>

                    <div class="tool-group manual-controls hidden" id="manual-controls">
                        <div class="brush-control">
                        <div class="brush-control">
                            <label>Size</label>
                            <input type="range" id="brush-size" min="5" max="200" value="30">
                            <span id="brush-size-value">30px</span>
                        </div>
                    </div>

                    <div class="tool-group wand-controls hidden" id="wand-controls">
                        <div class="brush-control">
                            <label>Tolerance</label>
                            <input type="range" id="wand-tolerance" min="1" max="100" value="30">
                            <span id="wand-tolerance-value">30</span>
                        </div>
                    </div>

                    <div class="tool-group">
                        <button id="zoom-in-btn" class="tool-btn" title="Zoom In (Scroll up)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                                <line x1="11" y1="8" x2="11" y2="14"/>
                                <line x1="8" y1="11" x2="14" y2="11"/>
                            </svg>
                        </button>
                        <button id="zoom-out-btn" class="tool-btn" title="Zoom Out (Scroll down)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                                <line x1="8" y1="11" x2="14" y2="11"/>
                            </svg>
                        </button>
                        <button id="zoom-fit-btn" class="tool-btn" title="Fit to Screen">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>
                            </svg>
                        </button>
                    </div>

                    <div class="tool-group">
                        <button id="undo-btn" class="tool-btn" disabled title="Undo">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 7v6h6"/>
                                <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
                            </svg>
                        </button>
                        <button id="redo-btn" class="tool-btn" disabled title="Redo">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 7v6h-6"/>
                                <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3L21 13"/>
                            </svg>
                        </button>
                    </div>

                    <div class="tool-group">
                        <button id="reset-btn" class="tool-btn" title="Reset image">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                                <path d="M3 3v5h5"/>
                            </svg>
                            <span>Reset</span>
                        </button>
                        <button id="new-image-btn" class="tool-btn" title="Upload new image">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="17 8 12 3 7 8"/>
                                <line x1="12" y1="3" x2="12" y2="15"/>
                            </svg>
                            <span>New</span>
                        </button>
                    </div>
                </div>

                <!-- Canvas Container -->
                <div class="canvas-container" id="canvas-container">
                    <div class="canvas-wrapper" id="canvas-wrapper">
                        <canvas id="main-canvas"></canvas>
                        <canvas id="before-canvas" class="hidden"></canvas>
                        <canvas id="overlay-canvas"></canvas>
                        <div id="selection-preview" class="selection-preview hidden"></div>
                        <div id="slider-handle" class="slider-handle hidden">
                            <div class="slider-line"></div>
                            <div class="slider-button">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M8 9l-4 3 4 3M16 9l4 3-4 3"/>
                                </svg>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Progress Overlay -->
                    <div id="progress-overlay" class="progress-overlay hidden">
                        <div class="progress-spinner"></div>
                        <p id="progress-text">Processing...</p>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="action-bar">
                    <button id="process-btn" class="btn btn-primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                        </svg>
                        Remove Icon
                    </button>
                    <button id="download-btn" class="btn btn-secondary hidden">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Download
                    </button>
                </div>

                <!-- Instructions -->
                <div class="instructions" id="instructions">
                    <p id="instruction-text">Click "Remove Icon" to auto-detect and remove the Gemini watermark</p>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Client-side processing • Your images never leave your browser</p>
        </footer>
    </div>

    <!-- Hidden canvas for processing -->
    <canvas id="processing-canvas" hidden></canvas>

    <script src="js/inpainter.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
